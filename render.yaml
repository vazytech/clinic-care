# Render Blueprint: Dashboard → New → Blueprint → pick this repository.
# Render asks for DATABASE_URL during setup (e.g. your Neon connection string).
services:
  - type: web
    name: clinic-care
    runtime: node
    plan: free            # sleeps when idle; use "starter" for an always-on clinic server
    region: frankfurt     # closest Render region to East Africa
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false       # entered by you in the Render dashboard, never stored in git
      - key: HOST
        value: 0.0.0.0
      - key: TZ
        value: Africa/Nairobi
      - key: NODE_ENV
        value: production
