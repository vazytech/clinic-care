# Netlify currently serves the standalone demo (demo/): no server, no sign-in,
# data stored in each visitor's browser.
#
# To serve the real app instead, once the backend is hosted (e.g. on Render):
#   1. change publish to "public"
#   2. uncomment the redirect below and put in your backend's address.
[build]
  publish = "demo"

# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND.onrender.com/api/:splat"
#   status = 200
#   force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'"
